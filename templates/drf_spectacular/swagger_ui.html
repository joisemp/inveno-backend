<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ title|default:"API Docs" }}</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% if favicon_href %}<link rel="icon" href="{{ favicon_href }}" />{% endif %}

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{{ swagger_ui_css }}" />

  {% include "drf_spectacular/_docs_styles.html" %}
</head>

<body>

  <!-- ── Top bar ────────────────────────────────────────────── -->
  <header id="topbar">
    {% include "drf_spectacular/_docs_topbar.html" with docs_nav="swagger" %}
  </header>

  <div id="swagger-ui"></div>

  <script src="{{ swagger_ui_bundle }}"></script>
  <script src="{{ swagger_ui_standalone }}"></script>

  {% if script_url %}
  <script src="{{ script_url }}"></script>
  {% else %}
  <script>
  {% include template_name_js %}
  </script>
  {% endif %}

  <!-- ── Custom copy buttons ───────────────────────────────── -->
  <script>
  (function () {
    /* SVG icon — two overlapping squares, same 20×20 as lock/arrow */
    const COPY_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M8 3a1 1 0 0 1 1-1h2a1 1 0 0 1 0 2H9a1 1 0 0 1-1-1z"/>
      <path fill="currentColor" d="M6 3a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2 3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z"/>
    </svg>`;

    const CHECK_ICON = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true" focusable="false">
      <path fill="currentColor" fill-rule="evenodd" d="M16.707 5.293a1 1 0 0 1 0 1.414l-8 8a1 1 0 0 1-1.414 0l-4-4a1 1 0 0 1 1.414-1.414L8 12.586l7.293-7.293a1 1 0 0 1 1.414 0z" clip-rule="evenodd"/>
    </svg>`;

    function injectCopyButtons() {
      document.querySelectorAll('.opblock-summary').forEach(function (summary) {
        if (summary.querySelector('.inv-copy-btn')) return;

        /* Grab the path string from Swagger's data attribute */
        var pathEl = summary.querySelector('[data-path]');
        if (!pathEl) return;
        var path = pathEl.dataset.path;

        var btn = document.createElement('button');
        btn.className = 'inv-copy-btn';
        btn.type = 'button';
        btn.title = 'Copy path';
        btn.innerHTML = COPY_ICON;

        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          navigator.clipboard.writeText(path).then(function () {
            btn.innerHTML = CHECK_ICON;
            btn.classList.add('copied');
            setTimeout(function () {
              btn.innerHTML = COPY_ICON;
              btn.classList.remove('copied');
            }, 1400);
          });
        });

        /* Place it right before the lock/auth button (or the arrow) */
        var anchor = summary.querySelector('.authorization__btn') ||
                     summary.querySelector('.opblock-control-arrow');
        if (anchor) {
          summary.insertBefore(btn, anchor);
        }
      });
    }

    /* Run once Swagger UI has rendered, then watch for new operations */
    var observer = new MutationObserver(injectCopyButtons);
    observer.observe(document.getElementById('swagger-ui'), {
      childList: true,
      subtree: true
    });

    /* Also run immediately in case operations are already in the DOM */
    injectCopyButtons();
  })();
  </script>

</body>
</html>
