###############################################################################
# Release workflow
# Triggered ONLY when a GitHub Release is published (e.g. v1.2.0).
# 1. Builds the production Docker image (multi-stage)
# 2. Pushes versioned + latest tags to GitHub Container Registry (GHCR)
# 3. Tests all migrations against a fresh Postgres — aborts if any fail
# 4. Redeploys the Railway API service via CLI so it pulls :latest
###############################################################################
name: Release — Build, Push & Deploy

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. your-org/inveno-api

jobs:
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Semver tag from the GitHub Release (e.g. v1.2.0 → 1.2.0)
            type=semver,pattern={{version}}
            # Always update the `latest` tag
            type=raw,value=latest

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Test migrations against a fresh Postgres before deploying.
  # If migrate fails this job fails and deploy-railway is automatically skipped.
  # ---------------------------------------------------------------------------
  test-migrations:
    name: Test Migrations Against Fresh DB
    runs-on: ubuntu-latest
    needs: build-and-push

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inveno_migrate_test
          POSTGRES_USER: inveno
          POSTGRES_PASSWORD: inveno
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inveno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # development settings inherit POSTGRES_* from base.py — no SSL or DO Spaces
    # credentials needed, which are unavailable in CI.
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: migration-test-secret-not-for-production
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: inveno_migrate_test
      POSTGRES_USER: inveno
      POSTGRES_PASSWORD: inveno
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      DEFAULT_FROM_EMAIL: noreply@inveno.app
      FRONTEND_URL: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Show migration plan
        run: python manage.py showmigrations

      - name: Apply all migrations
        run: python manage.py migrate --noinput

  deploy-railway:
    name: Trigger Railway Redeploy
    runs-on: ubuntu-latest
    needs: test-migrations
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Redeploy API
        run: railway redeploy --service "${{ secrets.RAILWAY_SERVICE_ID }}" -y
