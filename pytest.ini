[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
; Collect test_*.py files at any depth under tests/
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    ; WhiteNoise warns about missing staticfiles/ dir — harmless in tests
    ignore::UserWarning
    ; JWT warns when the test secret key is shorter than 32 bytes — not a prod concern
    ignore::jwt.warnings.InsecureKeyLengthWarning
