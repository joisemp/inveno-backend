###############################################################################
# FRONTEND DEVELOPER — COPY-PASTE COMPOSE FILE
# ─────────────────────────────────────────────────────────────────────────────
# Drop this file into your React project root.
# It pulls the pre-built API image from GHCR — no cloning the backend needed.
#
# SETUP (one-time):
#   1. Copy this file into your React project root.
#   2. Copy .env.frontend.example → .env.api  (get it from the backend repo)
#   3. Fill in the values in .env.api
#
# START:
#   docker compose -f docker-compose.frontend-dev.yml up
#
# API available at:      http://localhost:8000
# Swagger docs at:       http://localhost:8000/api/docs/
# ReDoc at:              http://localhost:8000/api/redoc/
# Mailpit inbox at:      http://localhost:8025
###############################################################################
name: inveno-frontend-dev

services:

  # ── API (pre-built image) ──────────────────────────────────────────────────
  api:
    image: ghcr.io/joisemp/inveno-backend:dev
    env_file: .env.api
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inveno
      POSTGRES_USER: inveno
      POSTGRES_PASSWORD: inveno
    volumes:
      - inveno_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inveno"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Mailpit (dev email inbox) ───────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # web UI  →  http://localhost:8025
      - "1025:1025"   # SMTP    →  Django sends here
    restart: unless-stopped

volumes:
  inveno_postgres_data:
